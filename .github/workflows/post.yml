name: Post to Instagram & Facebook

on:
  schedule:
    - cron: "0 2 * * 1,3,5"
  workflow_dispatch:
    inputs:
      date:
        description: "Post a specific date instead of today (YYYY-MM-DD)"
        required: false
      dry_run:
        description: "Dry run - log what would be posted, call no API"
        required: false
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run poster
        env:
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date=${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/post.js $ARGS

      - name: Commit updated posted-status
        if: always()
        run: |
          git config user.name "youthstoday-poster-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data/posts.json; then
            git add data/posts.json
            git commit -m "Mark $(date -u +%F) post as published [skip ci]"
            git push
          else
            echo "No change to data/posts.json - nothing to commit."
          fi
